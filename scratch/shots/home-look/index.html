<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Homepage Zatiaras — tangkapan layar</title>
		<style>
			:root {
				color-scheme: light;
			}
			body {
				margin: 0;
				padding: 24px;
				font:
					14px/1.5 system-ui,
					sans-serif;
				background: #fffdf9;
				color: #241a20;
			}
			h1 {
				margin: 0 0 4px;
				font-size: 20px;
			}
			p.meta {
				margin: 0 0 24px;
				color: #6b6167;
			}
			h2 {
				margin: 32px 0 12px;
				font-size: 16px;
				border-bottom: 1px solid #eee2e8;
				padding-bottom: 6px;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
				gap: 16px;
			}
			figure {
				margin: 0;
				border: 1px solid #eee2e8;
				border-radius: 12px;
				overflow: hidden;
				background: #fff;
			}
			img {
				display: block;
				width: 100%;
				height: auto;
			}
			figcaption {
				padding: 8px 12px;
				font-size: 12px;
				color: #6b6167;
				border-top: 1px solid #f4ecf0;
			}
		</style>
	</head>
	<body>
		<h1>Homepage Zatiaras — tangkapan layar</h1>
		<p class="meta">
			Dev server <code>http://localhost:5199</code> · desktop 1440×900 · mobile 390×844 · hasil di
			<code>scratch/shots/home-look/</code>
		</p>

		<h2>Desktop 1440×900</h2>
		<div class="grid">
			<figure>
				<img src="desktop-01-hero.png" alt="Hero JUS ALPUKAT" />
				<figcaption>01 Hero — "JUS ALPUKAT" + CTA</figcaption>
			</figure>
			<figure>
				<img src="desktop-02-assortment.png" alt="Jus Apa Aja Ada" />
				<figcaption>02 Jus Apa Aja Ada — 3 produk</figcaption>
			</figure>
			<figure>
				<img src="desktop-03-andalan.png" alt="Menu Andalan Zatiaras" />
				<figcaption>03 Menu Andalan Zatiaras</figcaption>
			</figure>
			<figure>
				<img src="desktop-04-pickup.png" alt="Pesan dulu, tinggal ambil" />
				<figcaption>04 Pesan dulu, tinggal ambil</figcaption>
			</figure>
			<figure>
				<img src="desktop-05-finder.png" alt="Temukan Zatiaras" />
				<figcaption>05 Temukan Zatiaras (peta + outlet)</figcaption>
			</figure>
			<figure>
				<img src="desktop-06-group.png" alt="Pesan Rame-Rame" />
				<figcaption>06 Pesan Rame-Rame</figcaption>
			</figure>
			<figure>
				<img src="desktop-07-proof.png" alt="Kentalnya Beneran" />
				<figcaption>07 Kentalnya Beneran (bukti produk)</figcaption>
			</figure>
			<figure>
				<img src="desktop-08-closing.png" alt="CTA penutup" />
				<figcaption>08 CTA penutup</figcaption>
			</figure>
			<figure>
				<img src="desktop-09-footer.png" alt="Footer" />
				<figcaption>09 Footer magenta</figcaption>
			</figure>
		</div>

		<h2>Mobile 390×844</h2>
		<div class="grid">
			<figure>
				<img src="mobile-01-hero.png" alt="Hero mobile" />
				<figcaption>01 Hero</figcaption>
			</figure>
			<figure>
				<img src="mobile-02-assortment.png" alt="Assortment mobile" />
				<figcaption>02 Jus Apa Aja Ada</figcaption>
			</figure>
			<figure>
				<img src="mobile-03-andalan.png" alt="Menu andalan mobile" />
				<figcaption>03 Menu Andalan</figcaption>
			</figure>
			<figure>
				<img src="mobile-05-finder.png" alt="Finder mobile" />
				<figcaption>05 Temukan Zatiaras</figcaption>
			</figure>
			<figure>
				<img src="mobile-06-group.png" alt="Group mobile" />
				<figcaption>06 Pesan Rame-Rame</figcaption>
			</figure>
			<figure>
				<img src="mobile-08-closing.png" alt="CTA mobile" />
				<figcaption>08 CTA penutup</figcaption>
			</figure>
		</div>
	</body>
</html>
